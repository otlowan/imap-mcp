[project]
name = "imap-mcp"
version = "0.1.0+hardened"
description = "Read-only MCP server for searching and reading mail across multiple IMAP accounts (hardened fork)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Lee Flannery" }
]
requires-python = ">=3.13"
keywords = ["mcp", "imap", "email", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "imap-tools>=1.16.0,<2",
    "mcp>=2.2.0,<3",
]

[project.urls]
Repository = "https://github.com/otlowan/imap-mcp"
Upstream = "https://github.com/LeeFlannery/imap-mcp"

[project.scripts]
imap-mcp = "imap_mcp:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
# Transitive via mcp (auth HTTP) : versions <= 2.13.0 visées par plusieurs avis GHSA.
constraint-dependencies = ["pyjwt>=2.14.0"]

[dependency-groups]
dev = [
    "cryptography>=50",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
